[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flask-lens"
version = "0.1.0"
description = "Real-time developer observability, SQL/N+1 profiler, EXPLAIN analyzer, cProfile flamegraph, request replayer, and pytest query-budget guardrails for Flask."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Duhan Güler", email = "45712664+duhanguler@users.noreply.github.com" },
]
keywords = [
    "flask",
    "profiler",
    "debug",
    "debugging",
    "observability",
    "sqlalchemy",
    "n-plus-one",
    "flamegraph",
    "django-silk",
    "telescope",
    "pytest",
    "assert-num-queries",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "flask>=2.3.0",
    "werkzeug>=2.3.0",
]

[project.optional-dependencies]
sqlalchemy = [
    "sqlalchemy>=2.0.0",
]
flask-sqlalchemy = [
    "flask-sqlalchemy>=3.1.0",
    "sqlalchemy>=2.0.0",
]
http = [
    "requests>=2.28.0",
    "httpx>=0.25.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "sqlalchemy>=2.0.0",
    "flask-sqlalchemy>=3.1.0",
    "requests>=2.28.0",
    "httpx>=0.25.0",
    "types-requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/duhanguler/flask-lens"
Repository = "https://github.com/duhanguler/flask-lens"
Documentation = "https://github.com/duhanguler/flask-lens#readme"
Issues = "https://github.com/duhanguler/flask-lens/issues"
Changelog = "https://github.com/duhanguler/flask-lens/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
flask_lens = "flask_lens.pytest_plugin"

[project.entry-points."flask.commands"]
lens = "flask_lens.cli:lens_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/flask_lens"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/benchmarks",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "flask_sqlalchemy.*",
    "sqlalchemy.*",
    "urllib3.*",
    "httpx.*",
    "pytest.*",
    "_pytest.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["flask_lens"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
